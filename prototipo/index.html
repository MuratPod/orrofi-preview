const I=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const orro=(s,n=48,b=1)=>`<img class="orro${b?' bob':''}" src="${A['orro-'+s]||''}" width="${n}" height="${n}" alt="">`;
const sb=()=>`<div class="sb"><span>9:41</span><span>5G ▮▮▮</span></div>`;
const nav=(t,big,right='')=>big?`<div class="nav big"><h2>${t}</h2>${right}</div>`:`<div class="nav"><button class="bk" aria-label="${x('Atrás','Back')}">${I('back')}</button><h2>${t}</h2></div>`;
const tabs=()=>`<div class="tabs"><div>${I('home')}${x('Inicio','Home')}</div><div class="on">${I('wifi')}${x('Servicios','Services')}</div><div>${I('bubble')}${x('Mi gestor','My manager')}</div><div>${I('doc')}${x('Facturas','Bills')}</div><div>${I('person')}${x('Perfil','Profile')}</div></div>`;
const sw=(on,l)=>`<button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${l}" onclick="this.classList.toggle('on');this.setAttribute('aria-checked',this.classList.contains('on'))"></button>`;
const phone=(cap,inner,cls='',id='')=>`<figure${id?` id="${id}"`:''}><div class="phone ${cls}">${inner}</div><figcaption>${cap}</figcaption></figure>`;
const screen=(t,body,o={})=>sb()+nav(t,o.big,o.right)+`<div class="body">${body}</div>`+(o.tabs?tabs():'');

const gateLS=()=>gate(x('Pendiente: Legal + Security','Pending: Legal + Security'));
const gateL=()=>gate(x('Pendiente: Legal','Pending: Legal'));

};

 $('.body > .cap.m:last-child',g).textContent=S.orro?x('Wi-Fi OrroFi activado: ya puedes ver el mapa.','Wi-Fi OrroFi is on: you can now see the map.'):x('El mapa se activa al encender tu Wi-Fi OrroFi.','The map turns on when you switch on your Wi-Fi OrroFi.');

 const sp=$$('.body > .card',P(19));
 if(S.pw){const pl=$('.pill',sp[0]);pl.className='pill ok';pl.textContent=x('Cambiada','Changed');$('.cap.m',sp[0]).textContent=x('Cambiada hoy desde la app','Changed today from the app')}

/* ---------- firma (canvas) ---------- */
let sigCv=null;
function sigColor(){return getComputedStyle(P(24)).getPropertyValue('--t').trim()||'#F6F4EE'}
function sigDraw(){if(!sigCv)return;const c=sigCv,k=c.getContext('2d');k.clearRect(0,0,c.width,c.height);k.strokeStyle=k.fillStyle=sigColor();k.lineWidth=4;k.lineCap=k.lineJoin='round';
 if(S.op.auto){k.font='italic 58px Georgia,serif';k.textAlign='center';k.textBaseline='middle';k.fillText('Ana Ejemplo',c.width/2,c.height/2+4)}
 for(const s of S.op.strokes){k.beginPath();s.forEach((p,j)=>j?k.lineTo(p[0],p[1]):k.moveTo(p[0],p[1]));if(s.length===1)k.lineTo(s[0][0]+.1,s[0][1]);k.stroke()}}
function sigInit(c){sigCv=c;let st=null,moved=0;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture?.(e.pointerId);st=[pt(e)];moved=0});
 c.addEventListener('pointermove',e=>{if(!st)return;const p=pt(e),q=st[st.length-1];moved+=Math.hypot(p[0]-q[0],p[1]-q[1]);st.push(p);if(moved>8){if(!S.op.strokes.includes(st)){S.op.auto=false;S.op.strokes.push(st)}sigDraw()}});
 const up=()=>{if(!st)return;if(moved<=8&&!S.op.strokes.includes(st)){S.op.auto=true;S.op.strokes=[]}st=null;sigDraw();applyOp()};
 c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
 c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();S.op.auto=true;S.op.strokes=[];sigDraw();applyOp()}});}
function applyOp(){const p=P(24);if(!p)return;const ck=$('.chk',p);ck.classList.toggle('on',S.op.chk);ck.setAttribute('aria-checked',S.op.chk);
 const has=S.op.auto||S.op.strokes.length>0;$('.sigbox',p).classList.toggle('done',has);sigDraw();
 const b=$('[data-act="sign"]',p);b.disabled=!(S.op.chk&&has);b.setAttribute('aria-disabled',b.disabled);
 $('#sighint').textContent=S.op.chk&&has?x('Listo para firmar','Ready to sign'):!S.op.chk&&!has?x('Marca la casilla y firma','Tick the box and sign'):!S.op.chk?x('Falta marcar la casilla','Tick the box'):x('Falta tu firma','Your signature is missing');}

/* ---------- navegación ---------- */
function show(i,push=true){
 i=Math.max(0,Math.min(NS()-1,i));
 if(push&&i!==cur){back.push(cur);fwd=[]}
 timers.forEach(clearTimeout);timers=[];closeSheet(true);$('#toast').classList.remove('on');
 ORIG_OV.forEach(k=>P(k).classList.add('ovx'));
 cur=i;[...PH.children].forEach((p,k)=>{p.classList.toggle('cur',k===i);p.toggleAttribute('inert',k!==i);p.setAttribute('aria-hidden',k!==i)});
 $$('.body',P(i)).forEach(b=>b.scrollTop=0);
 if(i===15)runImprove();
 if(i===24)sigDraw();
 chrome();
 try{history.replaceState(null,'','#'+code(i))}catch(e){}
}
const go=i=>show(i,true);
function goBack(){if(back.length){fwd.push(cur);show(back.pop(),false)}else if(cur>0){fwd.push(cur);show(cur-1,false)}}
function goFwd(){if(fwd.length){back.push(cur);show(fwd.pop(),false)}else if(cur<NS()-1)show(cur+1,true)}
function runImprove(){const st=$$('.step',P(15));
 const set=k=>st.forEach((s,j)=>{s.className='step '+(j<k?'done':j===k?'cur':'');$('i',s).textContent=j<k?'✓':j+1;j===k?s.setAttribute('aria-current','step'):s.removeAttribute('aria-current')});
 set(0);later(()=>set(1),1000);later(()=>set(2),2000);
 later(()=>{show(16,false);toast(x('Listo: canal 36 → 44','Done: channel 36 → 44'))},3000);}

 if(i===21){$('.fm .mono',ph).textContent='••••••••••••';$('.fm button',ph).setAttribute('aria-label',x('Mostrar contraseña (pide Face ID)','Show password (asks for Face ID)'))}
 else{$('.card .mono.m',ph).textContent=x('Contraseña','Password')+': ••••••••';$('[data-act="bio"]',ph).innerHTML=I('key')+x('Ver contraseña','Show password')}}

PH.addEventListener('click',e=>{const el=e.target.closest('[data-act]');
 if(el&&PH.contains(el)){if(el.disabled)return;e.preventDefault();const f=H[el.dataset.act];f&&f(el);return}

/* ---------- shell ---------- */
const toc=$('#toc');
function chrome(){
 $('#ttl').textContent=nameOf(cur);
 const g=groups().find(g=>g[1].includes(cur));$('#code').textContent=`${code(cur)} · ${g?g[0]:''}`;
 $('#cnt').textContent=`${cur+1} / ${NS()}`;
 $('#prev').disabled=!back.length&&cur===0;$('#next').disabled=!fwd.length&&cur===NS()-1;
 $$('.cell').forEach(c=>c.classList.toggle('cur',+c.dataset.j===cur));
}
function shellText(){
 document.documentElement.lang=lang;
 document.title='OrroFi · '+x('Mi red — prototipo clicable','My network — clickable prototype');
 const l=document.body.dataset.theme==='light';
 $('#tg').innerHTML=I(l?'spark':'moon','s')+`<span class="lbl2">${l?x('Tema: claro','Theme: light'):x('Tema: oscuro','Theme: dark')}</span>`;
 $('#tg').setAttribute('aria-label',x('Cambiar tema (oscuro / claro)','Switch theme (dark / light)'));$('#tg').setAttribute('aria-pressed',l);
 const on=document.body.classList.contains('showlinks');
 $('#lk').innerHTML=I('grid','s')+`<span class="lbl2">${x('Zonas táctiles','Tap areas')}</span>`;$('#lk').setAttribute('aria-label',x('Resaltar zonas táctiles','Highlight tap areas'));$('#lk').setAttribute('aria-pressed',on);
 $('#tocb').innerHTML=I('list','s')+`<span class="lbl2">${x('Todas las pantallas','All screens')}</span>`;$('#tocb').setAttribute('aria-label',x('Todas las pantallas','All screens'));
 $('#prev').innerHTML='← '+x('Atrás','Back');$('#next').innerHTML=x('Adelante','Forward')+' →';
 $('#hint').textContent=x('Toca los botones del móvil · ← → o Retroceso en el teclado','Tap the buttons in the phone · ← → or Backspace on the keyboard');
 $('#toch').textContent=x('Todas las pantallas de «Mi red»','All «My network» screens');
 $('#tocsub').textContent=x(`${NS()} pantallas · datos ficticios · toca una para ir`,`${NS()} screens · fictitious data · tap one to open`);
 $('#tocx').textContent='✕ '+x('Cerrar','Close');
 $('#l-es').setAttribute('aria-pressed',lang==='es');$('#l-en').setAttribute('aria-pressed',lang==='en');
 chrome();
}
function render(){
 SET=buildSet();
 PH.innerHTML=SET.map((s,i)=>`<div class="phone ${s[2]||''}" data-i="${i}" role="region" aria-label="${esc(s[0])}">${s[1]}</div>`).join('');
 wire();applyState();shellText();show(cur,false);if(!toc.hidden)buildToc();
}
function buildToc(){let h='';
 for(const [g,ids] of groups()){h+=`<h3 class="grp">${esc(g)}</h3><div class="cells">`+ids.map(i=>`<button class="cell${i===cur?' cur':''}" data-j="${i}"><span class="th" aria-hidden="true"><span class="thi"></span></span><span><small>${esc(code(i))}</small>${esc(nameOf(i))}</span></button>`).join('')+'</div>'}
 $('#cells').innerHTML=h;
 $$('#cells .cell').forEach(c=>{const ph=P(+c.dataset.j).cloneNode(true);ph.classList.remove('cur');ph.removeAttribute('role');ph.removeAttribute('aria-label');ph.removeAttribute('aria-hidden');
  ph.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));ph.querySelectorAll('canvas').forEach(e=>e.remove());ph.setAttribute('inert','');$('.thi',c).appendChild(ph);
  const th=$('.th',c);const w=th.clientWidth||126;th.style.setProperty('--ts',w/393);});
}
function openToc(){closeSheet(true);buildToc();toc.hidden=false;lastFocus=document.activeElement;$('#tocx').focus()}
function closeToc(){toc.hidden=true;$('#tocb').focus()}
$('#tocb').onclick=openToc;$('#tocx').onclick=closeToc;
$('#cells').onclick=e=>{const c=e.target.closest('.cell');if(c){closeToc();go(+c.dataset.j)}};
$('#prev').onclick=goBack;$('#next').onclick=goFwd;
$('#lk').onclick=()=>{document.body.classList.toggle('showlinks');shellText()};
$('#tg').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';shellText();sigDraw()};
$('#l-es').onclick=()=>{if(lang!=='es'){lang='es';render()}};
$('#l-en').onclick=()=>{if(lang!=='en'){lang='en';render()}};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!toc.hidden){closeToc();return}if($('.psh',PH)){closeSheet();return}const p=P(cur);if(ORIG_OV.includes(cur)&&!p.classList.contains('ovx')){closeOv(p);return}return}
 const t=e.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable]'))return;
 if(!toc.hidden||e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();goBack()}else if(e.key==='ArrowRight'){e.preventDefault();goFwd()}});
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));const i=SET.findIndex((s,k)=>code(k)===h);if(i>=0&&i!==cur)go(i)});
function fit(){const s=$('#stage');const k=Math.min((s.clientHeight-28)/852,(s.clientWidth-24)/393,1.15);$('#pw').style.transform=`translate(-50%,-50%) scale(${Math.max(.2,k)})`}
addEventListener('resize',fit);
$('#wmd').src=A['wordmark-dark']||'';$('#wml').src=A['wordmark-light']||'';
SET=buildSet();{const h=decodeURIComponent(location.hash.slice(1));const i=SET.findIndex((s,k)=>code(k)===h);cur=i>=0?i:0;}
render();fit();
